name: Native E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: |
          if [[ -f apps/desktop/package.json && -f apps/desktop/src-tauri/Cargo.toml && -f Cargo.toml && -f pnpm-lock.yaml ]]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  native-e2e:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run native E2E with synthetic fixtures
        run: pnpm test:e2e
      - name: Upload redacted E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
