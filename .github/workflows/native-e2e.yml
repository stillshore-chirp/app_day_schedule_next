name: Native release validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - all
      build_installers:
        description: Build and retain unsigned personal-use installers after E2E
        required: true
        default: false
        type: boolean

concurrency:
  group: native-release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Select platform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Build matrix
        shell: bash
        run: |
          case "${{ inputs.platform }}" in
            macos-arm64)
              matrix='{"include":[{"os":"macos-15","label":"macOS arm64"}]}'
              ;;
            macos-x64)
              matrix='{"include":[{"os":"macos-15-intel","label":"macOS x64"}]}'
              ;;
            windows-x64)
              matrix='{"include":[{"os":"windows-latest","label":"Windows x64"}]}'
              ;;
            all)
              matrix='{"include":[{"os":"macos-15","label":"macOS arm64"},{"os":"macos-15-intel","label":"macOS x64"},{"os":"windows-latest","label":"Windows x64"}]}'
              ;;
            *)
              echo "::error::Unsupported platform selection" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-e2e:
    name: Native E2E (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (Rust 1.89.0)
        with:
          toolchain: 1.89.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify patched dependency compatibility
        run: pnpm verify:patched-dependencies
      - name: Build isolated WebdriverIO debug application
        shell: bash
        run: DAY_SCHEDULE_GOOGLE_OAUTH_CLIENT_ID=synthetic-native-e2e-client.apps.googleusercontent.com VITE_WDIO=true pnpm --dir apps/desktop tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
      - name: Run native E2E with synthetic fixtures
        run: pnpm test:e2e
      - name: Compare macOS arm64 visual baselines
        if: matrix.label == 'macOS arm64'
        shell: bash
        run: |
          swift -module-cache-path "${RUNNER_TEMP}/swift-module-cache" \
            scripts/compare-visual-snapshots.swift \
            apps/desktop/tests/visual-baselines/macos-arm64 \
            apps/desktop/test-results \
            apps/desktop/test-results/visual-diff
      - name: Build normal unsigned Windows installer
        if: inputs.build_installers && success() && runner.os == 'Windows'
        run: pnpm tauri:build:debug
      - name: Build and verify normal unsigned macOS installer
        if: inputs.build_installers && success() && runner.os == 'macOS'
        shell: bash
        run: |
          CARGO_PROFILE_DEV_DEBUG=0 pnpm --dir apps/desktop tauri build --debug --bundles app
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          architecture="$(uname -m)"
          if [[ "$architecture" == "x86_64" ]]; then architecture="x64"; fi
          staging="${RUNNER_TEMP}/day-schedule-next-dmg"
          mkdir -p "$staging" target/debug/bundle/dmg
          cp -R "target/debug/bundle/macos/Day Schedule Next.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          # The E2E-feature and normal app builds otherwise keep several GB of
          # Cargo intermediates while hdiutil needs additional compression
          # space. The complete app is already staged outside target.
          cargo clean
          mkdir -p target/debug/bundle/dmg
          dmg="target/debug/bundle/dmg/Day Schedule Next_${version}_${architecture}.dmg"
          source_kib="$(du -sk "$staging" | cut -f1)"
          image_kib="$((source_kib + 262144))"
          hdiutil create -size "${image_kib}k" -volname "Day Schedule Next" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
      - name: Upload unsigned personal-use installer
        if: inputs.build_installers && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: day-schedule-next-debug-${{ matrix.label }}
          path: target/debug/bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Upload allowlisted synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-e2e-failure-${{ matrix.label }}
          path: |
            apps/desktop/test-results/native-settings-text-100.png
            apps/desktop/test-results/native-settings-text-250.png
            apps/desktop/test-results/native-today-text-250.png
            apps/desktop/test-results/native-today-text-250-narrow.png
            apps/desktop/test-results/native-today-readable-list-text-250.png
            apps/desktop/test-results/native-compact-text-250.png
            apps/desktop/test-results/native-compact-actions-text-250.png
            apps/desktop/test-results/native-analog-clock-text-250.png
            apps/desktop/test-results/native-analog-clock-minimum.png
            apps/desktop/test-results/visual-diff/native-today.png
            apps/desktop/test-results/visual-diff/native-week.png
            apps/desktop/test-results/visual-diff/native-template-editor.png
            apps/desktop/test-results/visual-diff/native-compact.png
            apps/desktop/test-results/visual-diff/native-conflict.png
            apps/desktop/test-results/visual-diff/native-google-calendar-recovery.png
            apps/desktop/test-results/visual-diff/native-google-calendar-recovery-text-200.png
          if-no-files-found: ignore
          retention-days: 7
