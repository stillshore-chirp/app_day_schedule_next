name: Native E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: |
          if [[ -f apps/desktop/package.json && -f apps/desktop/src-tauri/Cargo.toml && -f Cargo.toml && -f pnpm-lock.yaml ]]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  native-e2e:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x64
          - os: windows-latest
            label: Windows x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build isolated WebdriverIO debug application
        shell: bash
        run: VITE_WDIO=true pnpm --dir apps/desktop tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
      - name: Run native E2E with synthetic fixtures
        run: pnpm test:e2e
      - name: Upload redacted E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-e2e-${{ matrix.label }}
          path: |
            apps/desktop/test-results/
            apps/desktop/logs/
            apps/desktop/wdio-logs/
          if-no-files-found: ignore
          retention-days: 30
