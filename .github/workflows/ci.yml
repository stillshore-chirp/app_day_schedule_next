name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      native_changed: ${{ steps.scope.outputs.native_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify bootstrap harness
        run: npm run verify:bootstrap
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and accessibility tests
        run: |
          pnpm test
          pnpm test:a11y
      - name: Frontend build
        run: pnpm build
      - id: scope
        name: Detect native-impacting changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(apps/desktop/|Cargo\.toml$|Cargo\.lock$|pnpm-lock\.yaml$|package\.json$|rust-toolchain\.toml$|deny\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          fi

  native-smoke:
    name: Native smoke (macOS arm64)
    needs: quality
    if: needs.quality.outputs.native_changed == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-features
      - name: Build normal Tauri application without installer
        run: pnpm --dir apps/desktop tauri build --debug --no-bundle
