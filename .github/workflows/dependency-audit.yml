name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 17 1 * *"

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Known vulnerabilities, licenses and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify patched dependency compatibility
        run: pnpm verify:patched-dependencies
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level moderate
      - name: Verify Rust advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.89.0"
          command: check advisories licenses sources
          arguments: --all-features
          manifest-path: ./Cargo.toml
