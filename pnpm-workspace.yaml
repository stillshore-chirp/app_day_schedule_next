  "@wdio/utils>@puppeteer/browsers": 3.2.6
  baseline-browser-mapping: 2.11.0
  brace-expansion: 5.0.12
  browserslist: 4.28.7
  "cheerio>undici": 7.30.1
  js-yaml: 4.3.2
  modern-tar: 0.7.6
  nanoid: 3.3.18
  postcss: 8.5.23
  serialize-javascript: 7.1.3
  smol-toml: 1.9.1
  source-map-js: 1.2.2
  "webdriver>undici": 6.29.1

allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false

patchedDependencies:
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
