[package]
name = "day-schedule-next"
version = "0.1.0"
description = "Local-first minute-precision day scheduling desktop app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "day_schedule_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "day-schedule-next"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["google-sync"]
google-sync = ["dep:base64", "dep:keyring", "dep:rand", "dep:reqwest"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
rand = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
